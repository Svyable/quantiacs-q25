name: ebenezar-profile-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'strategies/generated/ebenezar_20260912_*.py'
      - 'experiments/ebenezar_20260912/**'
      - 'research/benchmark.py'
      - 'research/iteration.py'
      - '.github/workflows/ebenezar-profile-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-profile-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
      CAMPAIGN: ebenezar_20260912
      MANIFEST: experiments/ebenezar_20260912/manifest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quantiacs toolbox
        run: python -m pip install -r requirements.txt

      # The repository-wide pytest/static suite is enforced independently by
      # research-integrity on the same PR. Do not duplicate it here; this job
      # is the exact market-evidence lane.
      - name: Compile translated strategies
        run: python -m compileall -q strategies/generated/ebenezar_20260912_*.py

      - name: Verify frozen preregistrations and source hashes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.iteration import load_manifest
          from research.preregister import sha256_file

          root = Path('.')
          dest = root / 'experiments/ebenezar_20260912'
          manifest = load_manifest(dest / 'manifest.json')
          freeze = json.loads((dest / 'implementation_freeze.json').read_text())
          assert freeze['frozen_before_measurement'] is True
          assert freeze['activation_type'] == 'USER_DIRECTED_PROFILE_TRANSLATION'
          assert manifest['selection_folds'] == ['research', 'dev']
          assert len(manifest['candidates']) == 7
          for slug, digest in freeze['preregistration_sha256'].items():
              assert sha256_file(dest / slug / 'preregistration.json') == digest
          print('Ebenezar profile freeze verified')
          PY

      - name: Diagnose exact causality gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import xarray as xr
          import qnt.data as qndata
          from research.benchmark import check_causality, load_module, policy
          from research.iteration import load_manifest

          root = Path('.')
          manifest = load_manifest(root / 'experiments/ebenezar_20260912/manifest.json')
          folds, _ = policy()
          data = qndata.cryptodaily_load_data(min_date='2015-01-01', max_date=folds[-1]['end'])
          data = data.sel(time=slice('2015-01-01', folds[-1]['end']))
          cuts = sorted(set(np.linspace(min(20, data.sizes['time'] - 1), data.sizes['time'] - 1, 7, dtype=int)))
          for candidate in manifest['candidates']:
              module = load_module(root / candidate['path'])
              fn = lambda d, m=module, c=candidate: m.strategy(d, c['params'], c['mode'])
              weights = fn(data)
              try:
                  result = check_causality(fn, data, weights)
                  print(candidate['id'], 'PASS', result, 'coords=', list(weights.coords))
              except Exception as exc:
                  print(candidate['id'], 'FAIL', type(exc).__name__, repr(str(exc)), 'coords=', list(weights.coords))
                  for i in cuts:
                      prefix = data.isel(time=slice(0, i + 1))
                      got = fn(prefix)
                      delta = np.abs(got.values - weights.isel(time=slice(0, i + 1)).values)
                      maximum = float(np.nanmax(delta))
                      if maximum > 1e-10:
                          row, col = np.unravel_index(np.nanargmax(delta), delta.shape)
                          print(
                              candidate['id'], 'FIRST_DIVERGENT_CHECKPOINT', i,
                              'max_abs=', maximum,
                              'time=', str(prefix.time.values[row]),
                              'asset=', str(prefix.asset.values[col]),
                              'prefix_weight=', float(got.values[row, col]),
                              'full_weight=', float(weights.values[row, col]),
                          )
                          break
                  try:
                      with xr.set_options(use_bottleneck=False):
                          stable_full = fn(data)
                          stable = check_causality(fn, data, stable_full)
                      print(candidate['id'], 'NO_BOTTLENECK_PASS', stable)
                  except Exception as stable_exc:
                      print(candidate['id'], 'NO_BOTTLENECK_FAIL', type(stable_exc).__name__, repr(str(stable_exc)))
          PY

      - name: Run exact Quantiacs development screen
        run: |
          python -m research.iteration \
            --manifest "$MANIFEST" \
            --output "results/$CAMPAIGN" \
            --budget 10

      - name: Print exact evidence
        if: always()
        run: |
          RESULT_DIR="$(find "results/$CAMPAIGN" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          echo "RESULT_DIR=$RESULT_DIR"
          test -n "$RESULT_DIR"
          cat "$RESULT_DIR/report.md" || true
          python - "$RESULT_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for name in ('rankings.json','residual_diagnostics.json'):
              path = root / name
              if path.exists():
                  print(f'\n=== {name} ===')
                  print(json.dumps(json.loads(path.read_text()), indent=2, sort_keys=True))
          PY

      - name: Preserve exact measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAMPAIGN }}-measured-${{ github.run_id }}
          path: results/${{ env.CAMPAIGN }}/
          if-no-files-found: warn
