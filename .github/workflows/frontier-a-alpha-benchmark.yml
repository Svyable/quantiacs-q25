name: frontier-a-alpha-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/frontier-a-alpha-benchmark.yml'
      - 'strategies/generated/frontier_20260910_*.py'
      - 'experiments/frontier_20260910/manifest.json'
      - 'experiments/frontier_20260910/*/preregistration.json'
      - 'research/benchmark.py'
      - 'research/iteration.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-alpha-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
      CAMPAIGN: frontier_20260910
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quantiacs toolbox and tests
        run: python -m pip install -r requirements.txt pytest

      - name: Prove frozen alpha sources and preregistrations
        run: |
          sha256sum \
            strategies/generated/frontier_20260910_forecast_surprise.py \
            strategies/generated/frontier_20260910_flow_absorption.py \
            strategies/generated/frontier_20260910_vol_curve.py \
            experiments/frontier_20260910/manifest.json \
            experiments/frontier_20260910/forecast_surprise/preregistration.json \
            experiments/frontier_20260910/flow_absorption/preregistration.json \
            experiments/frontier_20260910/vol_curve/preregistration.json

      - name: Run software and causality gates
        run: python -m pytest -q tests

      - name: Run frozen preregistered alpha campaign
        run: |
          python -m research.iteration \
            --manifest "experiments/$CAMPAIGN/manifest.json" \
            --output "results/$CAMPAIGN" \
            --budget 18

      - name: Print alpha evidence
        if: always()
        run: |
          RESULT_DIR="$(find "results/$CAMPAIGN" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          echo "RESULT_DIR=$RESULT_DIR"
          test -n "$RESULT_DIR"
          cat "$RESULT_DIR/report.md" || true
          echo "\n=== RESIDUAL DIAGNOSTICS ==="
          cat "$RESULT_DIR/residual_diagnostics.json" || true
          echo "\n=== FAMILY DECISIONS ==="
          cat "$RESULT_DIR/freeze_ledger.json" || true

      - name: Preserve measured alpha evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAMPAIGN }}-alpha-measured-${{ github.run_id }}
          path: results/${{ env.CAMPAIGN }}/
          if-no-files-found: warn
