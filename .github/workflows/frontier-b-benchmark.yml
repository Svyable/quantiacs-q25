name: frontier-b-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'strategies/generated/frontier_20260910b_*.py'
      - 'experiments/frontier_20260910b/manifest.json'
      - 'experiments/frontier_20260910b/*/preregistration.json'
      - 'experiments/frontier_20260910b/*/preregistration.sha256'
      - 'tests/test_frontier_b.py'
      - '.github/workflows/frontier-b-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
      CAMPAIGN: frontier_20260910b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quantiacs toolbox and tests
        run: python -m pip install -r requirements.txt pytest

      - name: Run software and causality gates
        run: python -m pytest -q tests

      - name: Run exact development campaign with public/default access
        run: |
          python -m research.iteration \
            --manifest "experiments/$CAMPAIGN/manifest.json" \
            --output "results/$CAMPAIGN" \
            --budget 18

      - name: Print measured campaign report
        if: always()
        run: |
          RESULT_DIR="$(find "results/$CAMPAIGN" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          echo "RESULT_DIR=$RESULT_DIR"
          test -n "$RESULT_DIR"
          cat "$RESULT_DIR/report.md" || true
          python - "$RESULT_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path(sys.argv[1])
          ranks = json.loads((root / "rankings.json").read_text())
          print("\n=== FULL RANKINGS JSON ===")
          print(json.dumps(ranks, indent=2, sort_keys=True))

          print("\n=== CANONICAL BASE METRICS ===")
          for family, cid in [
              ("topology_migration", "topology_migration_w63"),
              ("liquidity_hysteresis", "liquidity_hysteresis_w42"),
              ("shock_recovery_surface", "shock_recovery_surface_w42"),
          ]:
              path = root / f"{cid}.json"
              if not path.exists():
                  print(f"{family}: MISSING")
                  continue
              record = json.loads(path.read_text())
              print(f"\n{family} status={record.get('status')}")
              print(json.dumps(record.get("metrics", {}), indent=2, sort_keys=True))
              ret_path = root / f"{cid}_returns.csv"
              if not ret_path.exists():
                  continue
              frame = pd.read_csv(ret_path, index_col=0, parse_dates=True)
              for fold in ("research", "dev"):
                  if fold not in frame:
                      continue
                  rr = frame[fold].dropna().astype(float)
                  if rr.empty:
                      continue
                  downside = np.minimum(rr.to_numpy(), 0.0)
                  downside_dev = float(np.sqrt(np.mean(downside ** 2)))
                  sortino = float(np.sqrt(365) * rr.mean() / downside_dev) if downside_dev > 0 else None
                  growth = float(np.prod(1.0 + rr.to_numpy()))
                  cagr = growth ** (365.0 / len(rr)) - 1.0 if growth > 0 else None
                  cell = record.get("metrics", {}).get(fold, {}).get("0.04", {})
                  max_dd = cell.get("max_drawdown")
                  calmar = cagr / abs(max_dd) if cagr is not None and max_dd not in (None, 0) else None
                  print(json.dumps({
                      "fold": fold,
                      "cost": "0.04",
                      "derived_cagr": cagr,
                      "derived_sortino": sortino,
                      "derived_calmar": calmar,
                      "observations": len(rr),
                  }, sort_keys=True))
          PY

      - name: Preserve measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAMPAIGN }}-measured-${{ github.run_id }}
          path: results/${{ env.CAMPAIGN }}/
          if-no-files-found: warn
