name: frontier-h-alpha-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/frontier-h-alpha-benchmark.yml'
      - 'strategies/generated/frontier_20260911h_*.py'
      - 'experiments/frontier_20260911h/**'
      - 'research/benchmark.py'
      - 'research/iteration.py'
      - 'research/mechanism_diagnostics.py'
      - 'scripts/analyze_mechanism_controls.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measured-alpha-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_KEY: default
      CAMPAIGN: frontier_20260911h
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen measurement dependencies
        run: |
          python -m pip install "git+https://github.com/quantiacs/toolbox.git@9e5274c5ce102a66debc799fd2a2300969fb90f6" \
            numpy==2.2.6 pandas==2.2.3 xarray==2025.12.0 numba==0.61.2 llvmlite==0.44.0 pyyaml pytest
      - name: Regenerate and commit rebased dashboard
        run: |
          python scripts/build_research_dashboard.py
          if ! git diff --quiet -- docs/RESEARCH_MATRIX.md docs/data/strategy_matrix.json; then
            git config user.name "q25-research-bot"
            git config user.email "129682319+Svyable@users.noreply.github.com"
            git add docs/RESEARCH_MATRIX.md docs/data/strategy_matrix.json
            git commit -m "Regenerate research dashboard with Frontier-H evidence"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Test software integrity
        run: python -m pytest -q tests
      - name: Measure frozen development campaign and matched controls
        run: |
          python -m research.iteration --manifest "experiments/$CAMPAIGN/manifest.json" --output "results/$CAMPAIGN" --budget 18
          python - <<'PY'
          import os
          from pathlib import Path
          import qnt.data as qndata
          from scripts.analyze_mechanism_controls import analyze
          campaign = os.environ['CAMPAIGN']
          contexts = list(Path('results', campaign).glob('*/context.json'))
          assert len(contexts) == 1, 'expected one complete data context'
          run = contexts[0].parent
          data_path = Path('results', campaign, 'development.nc')
          qndata.cryptodaily_load_data(min_date='2015-01-01', max_date='2022-12-31').to_netcdf(data_path)
          analyze(Path('experiments', campaign, 'manifest.json'), run, data_path,
                  Path('experiments', campaign, 'analysis_plan.json'))
          PY
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-h-measured-${{ github.run_id }}
          path: |
            results/frontier_20260911h/
            !results/frontier_20260911h/*.nc
          if-no-files-found: warn
