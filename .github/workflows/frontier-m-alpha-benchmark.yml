name: frontier-m-alpha-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'strategies/generated/frontier_20260912m_*.py'
      - 'experiments/frontier_20260912m/**'
      - 'research/benchmark.py'
      - 'research/iteration.py'
      - '.github/workflows/frontier-m-alpha-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measured-alpha-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
      CAMPAIGN: frontier_20260912m
      MANIFEST: experiments/frontier_20260912m/manifest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quantiacs toolbox and tests
        run: python -m pip install -r requirements.txt pytest

      - name: Run full software, provenance and causality suite
        run: python -m pytest -q tests

      - name: Verify generated dashboard is canonical before measurement
        run: python scripts/build_research_dashboard.py --check

      - name: Prove Frontier-M freeze exists before market measurement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.iteration import load_manifest
          from research.preregister import sha256_file

          dest = Path('experiments/frontier_20260912m')
          manifest = load_manifest(dest / 'manifest.json')
          freeze = json.loads((dest / 'implementation_freeze.json').read_text())
          assert freeze['frozen_before_measurement'] is True
          assert freeze['market_returns_observed_before_freeze'] is False
          assert freeze['activation_type'] == 'NEW_PREREGISTERED_FRONTIER'
          assert manifest['selection_folds'] == ['research', 'dev']
          assert len(manifest['candidates']) == 15
          for family, digest in freeze['preregistration_sha256'].items():
              assert sha256_file(dest / family / 'preregistration.json') == digest
          for family, digest in freeze['reserve_preregistration_sha256'].items():
              assert sha256_file(dest / family / 'preregistration.json') == digest
          print('Frontier-M pre-return freeze verified')
          PY

      - name: Run exact Frontier-M development campaign
        id: measure
        run: |
          python -m research.iteration \
            --manifest "$MANIFEST" \
            --output "results/$CAMPAIGN" \
            --budget 18

      - name: Print Frontier-M evidence
        if: ${{ always() && steps.measure.outcome == 'success' }}
        run: |
          RESULT_DIR="$(find "results/$CAMPAIGN" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          echo "RESULT_DIR=$RESULT_DIR"
          test -n "$RESULT_DIR"
          cat "$RESULT_DIR/report.md" || true
          python - "$RESULT_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for name in ('rankings.json','family_decisions.json','residual_diagnostics.json'):
              path = root / name
              if path.exists():
                  print(f'\n=== {name} ===')
                  print(json.dumps(json.loads(path.read_text()), indent=2, sort_keys=True))
          PY

      - name: Preserve measured Frontier-M evidence
        if: ${{ always() && steps.measure.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAMPAIGN }}-measured-${{ github.run_id }}
          path: results/${{ env.CAMPAIGN }}/
          if-no-files-found: error
