name: frontier-mid126-public-evidence

on:
  push:
    branches: [research-factory-scale-20260916]
    paths:
      - '.github/workflows/frontier-mid126-public-evidence.yml'
      - 'q25_round2_research.py'
      - 'q25_round3_research.py'
      - 'q25_round4_research.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  API_KEY: default

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen Quantiacs stack
        run: |
          python -m pip install --disable-pip-version-check \
            'git+https://github.com/quantiacs/toolbox.git@9e5274c5ce102a66debc799fd2a2300969fb90f6' \
            numpy==2.2.6 pandas==2.2.3 xarray==2025.12.0 scipy==1.18.1
      - name: Run current public-data evidence
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          import xarray as xr
          import qnt.data as qndata
          import qnt.output as qnout
          import qnt.stats as qnstats
          import q25_round2_research as r2
          import q25_round3_research as r3
          import q25_round4_research as r4

          data = qndata.cryptodaily_load_data(min_date='2014-01-01')
          def field(name):
              da = data.sel(field=name).transpose('time','asset')
              return pd.DataFrame(np.asarray(da.values,dtype=float), index=pd.DatetimeIndex(da.time.values,name='time'), columns=pd.Index(da.asset.values,name='asset'))

          market = r2.MarketData(
              open=field('open'), low=field('low'), high=field('high'),
              close_raw=field('close'), volume_raw=field('vol'), liquid_raw=field('is_liquid')
          )
          ctx = r2.build_context(market)
          round2 = r2.build_strategies(ctx)
          round3, _ = r3.build_round3_candidates(ctx, round2)
          selected, _ = r4.build_selected_round4(ctx, round3['protective_fast63'])
          frame = selected['frontier_mid126_v4']
          weights = xr.DataArray(frame.to_numpy(float), coords={'time':frame.index,'asset':frame.columns}, dims=('time','asset'), name='weights')
          weights = qnout.clean(weights, data, 'crypto_daily_long')
          contest = weights.sel(time=slice('2016-01-01',None))
          qnout.check(contest, data, 'crypto_daily_long', check_correlation=False)

          rows=[]
          for slip in (0.00,0.04,0.08,0.12):
              stat=qnstats.calc_stat(data, contest, slippage_factor=slip).isel(time=-1)
              fields=set(map(str,stat.field.values))
              def get(*names):
                  for n in names:
                      if n in fields: return float(stat.sel(field=n).item())
                  return None
              rows.append({'slippage_factor':slip,'equity':get('equity'),'sharpe':get('sharpe_ratio','sharpe'),'volatility':get('volatility'),'max_drawdown':get('max_drawdown'),'avg_turnover':get('avg_turnover')})

          values=np.asarray(contest.values,float)
          result={
              'data_end':str(pd.Timestamp(data.time.values[-1]).date()),
              'rows':rows,
              'max_gross':float(values.sum(axis=1).max()),
              'avg_gross':float(values.sum(axis=1).mean()),
              'max_weight':float(values.max()),
              'non_liquid_exposure':float(np.where(np.asarray(data.sel(field='is_liquid').sel(time=contest.time).transpose('time','asset').values)>0,0.0,values).max()),
          }
          print('FRONTIER_MID126_PUBLIC_EVIDENCE')
          print(json.dumps(result,indent=2))
          with open('frontier_mid126_public_evidence.json','w') as f: json.dump(result,f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-mid126-public-evidence
          path: frontier_mid126_public_evidence.json
