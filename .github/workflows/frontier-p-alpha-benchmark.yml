name: frontier-p-alpha-benchmark

on:
  pull_request:
    branches: [main, measure-frozen-queue-20260916]
    paths:
      - 'strategies/generated/frontier_20260916p_*.py'
      - 'experiments/frontier_20260916p/**'
      - 'tests/test_frontier_p.py'
      - 'research/benchmark.py'
      - 'research/iteration.py'
      - 'evidence/frontier_20260913m/**'
      - 'evidence/frontier_20260913o/**'
      - 'evidence/frontier_20260916p/**'
      - 'evidence/measurement_receipts/frontier_20260916p.json'
      - 'scripts/build_methodology_health.py'
      - 'scripts/build_research_control_plane.py'
      - 'scripts/build_recursive_learning.py'
      - '.github/workflows/frontier-p-alpha-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measured-alpha-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
      CAMPAIGN: frontier_20260916p
      MANIFEST: experiments/frontier_20260916p/manifest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quantiacs toolbox and tests
        run: python -m pip install -r requirements.txt pytest

      - name: Regenerate evidence-derived research telemetry
        run: |
          python scripts/build_methodology_health.py
          python scripts/build_research_control_plane.py
          python scripts/build_recursive_learning.py

      - name: Preserve generated research telemetry
        uses: actions/upload-artifact@v4
        with:
          name: frontier-p-research-telemetry-${{ github.run_id }}
          path: |
            docs/data/methodology_health.json
            docs/METHODOLOGY_HEALTH.md
            docs/data/research_control_plane.json
            docs/RESEARCH_CONTROL_PLANE.md
            docs/data/recursive_learning.json
            docs/RECURSIVE_LEARNING.md
          if-no-files-found: error

      - name: Run full software, provenance and causality suite
        run: python -m pytest -q tests

      - name: Verify generated dashboard is canonical before measurement
        run: python scripts/build_research_dashboard.py --check

      - name: Prove Frontier-P freeze exists before market measurement
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from research.iteration import load_manifest

          root = Path('experiments/frontier_20260916p')
          manifest = load_manifest(root / 'manifest.json')
          freeze = json.loads((root / 'implementation_freeze.json').read_text())
          family = 'liquidity_requalification_hysteresis'
          prereg = root / family / 'preregistration.json'
          source = Path('strategies/generated/frontier_20260916p_liquidity_requalification_hysteresis.py')
          assert freeze['frozen_before_measurement'] is True
          assert freeze['market_returns_observed_before_freeze'] is False
          assert freeze['activation_type'] == 'NEW_PREREGISTERED_FRONTIER'
          assert manifest['selection_folds'] == ['research', 'dev']
          assert len(manifest['candidates']) == 5
          assert hashlib.sha256(prereg.read_bytes()).hexdigest() == freeze['preregistration_sha256'][family]
          assert hashlib.sha256(source.read_bytes()).hexdigest() == freeze['strategy_sha256'][family]
          print('Frontier-P pre-return freeze verified')
          PY

      - name: Run exact Frontier-P development campaign
        id: measure
        run: |
          python -m research.iteration \
            --manifest "$MANIFEST" \
            --output "results/$CAMPAIGN" \
            --budget 8

      - name: Print Frontier-P evidence
        if: ${{ always() && steps.measure.outcome == 'success' }}
        run: |
          RESULT_DIR="$(find "results/$CAMPAIGN" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          echo "RESULT_DIR=$RESULT_DIR"
          test -n "$RESULT_DIR"
          cat "$RESULT_DIR/report.md" || true
          python - "$RESULT_DIR" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for name in ('rankings.json','family_decisions.json','residual_diagnostics.json'):
              path = root / name
              if path.exists():
                  print(f'\n=== {name} ===')
                  print(json.dumps(json.loads(path.read_text()), indent=2, sort_keys=True))
          PY

      - name: Preserve measured Frontier-P evidence
        if: ${{ always() && steps.measure.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAMPAIGN }}-measured-${{ github.run_id }}
          path: results/${{ env.CAMPAIGN }}/
          if-no-files-found: error
