name: omni-cross-asset-diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/omni_cross_asset_diagnostics.py'
      - '.github/workflows/omni-cross-asset-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explanatory-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_KEY: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Quantiacs toolbox
        run: python -m pip install -r requirements.txt
      - name: Run post-observation target diagnostics
        run: |
          mkdir -p results/omni_cross_asset_diagnostics
          python research/omni_cross_asset_diagnostics.py --output results/omni_cross_asset_diagnostics/diagnostics.json
      - name: Preserve explanatory evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: omni-cross-asset-diagnostics-${{ github.run_id }}
          path: results/omni_cross_asset_diagnostics/
          if-no-files-found: warn
