name: omni-cross-asset-frontier-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'strategies/generated/omni_cross_asset_frontier.py'
      - 'strategies/generated/omni_stock_turbulence_ic_overlay.py'
      - 'experiments/omni_cross_asset_frontier_20260915/**'
      - 'tests/test_omni_cross_asset_frontier.py'
      - '.github/workflows/omni-cross-asset-frontier-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_KEY: default
      EXPERIMENT: omni_cross_asset_frontier_20260915
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quantiacs toolbox and tests
        run: python -m pip install -r requirements.txt pytest

      - name: Verify preregistration and implementation freeze
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          root = Path('experiments/omni_cross_asset_frontier_20260915')
          freeze = json.loads((root / 'implementation_freeze.json').read_text())
          assert freeze['frozen_before_measurement'] is True
          assert freeze['new_family_returns_observed_before_freeze'] is False
          for path_key, sha_key in (
              ('preregistration_path','preregistration_git_blob_sha'),
              ('strategy_path','strategy_git_blob_sha')):
              path = freeze[path_key]
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == freeze[sha_key], (path, actual, freeze[sha_key])
          print('OMNI frontier pre-return freeze verified')
          PY

      - name: Run causal and constraint tests
        run: python -m pytest -q tests/test_omni_cross_asset_frontier.py

      - name: Measure preregistered wave 1
        run: |
          mkdir -p "results/$EXPERIMENT"
          python strategies/generated/omni_cross_asset_frontier.py \
            --output "results/$EXPERIMENT/summary.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/omni_cross_asset_frontier_20260915/summary.json')
          x=json.loads(p.read_text())
          print('\n=== FAMILY DECISIONS ===')
          print(json.dumps(x['family_decisions'], indent=2, sort_keys=True))
          rows=[]
          for name,m in x['metrics'].items():
              rows.append((m['selection_2016_2022']['sharpe'], m['full_is']['sharpe'], name))
          print('\n=== TOP BY SELECTION SHARPE ===')
          for sel,full,name in sorted(rows, reverse=True)[:12]:
              print(f'{name:48s} selection={sel!s:>10} full={full!s:>10}')
          PY

      - name: Preserve measured evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPERIMENT }}-measured-${{ github.run_id }}
          path: results/${{ env.EXPERIMENT }}/
          if-no-files-found: warn
