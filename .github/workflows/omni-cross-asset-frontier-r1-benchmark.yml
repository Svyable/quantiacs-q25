name: omni-cross-asset-frontier-r1-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'strategies/generated/omni_cross_asset_frontier_r1.py'
      - 'tests/test_omni_cross_asset_frontier_r1.py'
      - 'experiments/omni_cross_asset_frontier_20260915r1/**'
      - '.github/workflows/omni-cross-asset-frontier-r1-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure-frontier-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_KEY: default
      EXPERIMENT: omni_cross_asset_frontier_20260915r1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quantiacs toolbox and tests
        run: python -m pip install -r requirements.txt pytest

      - name: Verify pre-market repair record
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          r=json.loads(Path('experiments/omni_cross_asset_frontier_20260915r1/repair_record.json').read_text())
          assert r['market_returns_observed_for_wave1_before_repair'] is False
          assert r['formula_changed'] is False and r['parameter_changed'] is False
          assert r['selection_rule_changed'] is False and r['portfolio_rule_changed'] is False
          actual=subprocess.check_output(['git','hash-object','strategies/generated/omni_cross_asset_frontier_r1.py'], text=True).strip()
          assert actual == r['repair_wrapper_git_blob_sha'], (actual, r['repair_wrapper_git_blob_sha'])
          print('pre-market implementation-only repair verified')
          PY

      - name: Run repaired causal and constraint tests
        run: python -m pytest -q tests/test_omni_cross_asset_frontier_r1.py

      - name: Measure preregistered wave 1 after implementation repair
        run: |
          mkdir -p "results/$EXPERIMENT"
          python strategies/generated/omni_cross_asset_frontier_r1.py \
            --output "results/$EXPERIMENT/summary.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/omni_cross_asset_frontier_20260915r1/summary.json')
          x=json.loads(p.read_text())
          print('\n=== FAMILY DECISIONS ===')
          print(json.dumps(x['family_decisions'], indent=2, sort_keys=True))
          rows=[]
          for name,m in x['metrics'].items():
              rows.append((m['selection_2016_2022']['sharpe'], m['full_is']['sharpe'], name))
          print('\n=== TOP BY 2016-2022 SELECTION SHARPE ===')
          for sel,full,name in sorted(rows, reverse=True)[:20]:
              print(f'{name:48s} selection={sel!s:>12} full={full!s:>12}')
          PY

      - name: Preserve repaired measured evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPERIMENT }}-measured-${{ github.run_id }}
          path: results/${{ env.EXPERIMENT }}/
          if-no-files-found: warn
