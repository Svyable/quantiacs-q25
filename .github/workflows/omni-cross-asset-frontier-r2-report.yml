name: omni-cross-asset-frontier-r2-report

on:
  pull_request:
    branches: [main]
    paths:
      - 'strategies/generated/omni_cross_asset_frontier_r2.py'
      - 'experiments/omni_cross_asset_frontier_20260915r2/**'
      - '.github/workflows/omni-cross-asset-frontier-r2-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persist-wave1-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_KEY: default
      EXPERIMENT: omni_cross_asset_frontier_20260915r2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Quantiacs toolbox and tests
        run: python -m pip install -r requirements.txt pytest
      - name: Verify reporting-only repair
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          r=json.loads(Path('experiments/omni_cross_asset_frontier_20260915r2/reporting_repair.json').read_text())
          assert r['market_returns_observed_before_repair'] is True
          assert r['economic_results_changed'] is False
          assert r['formula_changed'] is False and r['parameter_changed'] is False
          actual=subprocess.check_output(['git','hash-object','strategies/generated/omni_cross_asset_frontier_r2.py'],text=True).strip()
          assert actual==r['reporting_wrapper_git_blob_sha'],(actual,r['reporting_wrapper_git_blob_sha'])
          print('post-measurement reporting-only repair verified')
          PY
      - name: Re-run unchanged causal tests
        run: python -m pytest -q tests/test_omni_cross_asset_frontier_r1.py
      - name: Reproduce and persist already-observed wave 1 results
        run: |
          mkdir -p "results/$EXPERIMENT"
          python strategies/generated/omni_cross_asset_frontier_r2.py --output "results/$EXPERIMENT/summary.json"
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/omni_cross_asset_frontier_20260915r2/summary.json').read_text())
          print('\n=== WAVE 1 FAMILY DECISIONS ===')
          print(json.dumps(x['family_decisions'],indent=2,sort_keys=True))
          rows=[]
          for name,m in x['metrics'].items():
              rows.append((m['selection_2016_2022']['sharpe'],m['full_is']['sharpe'],m['diagnostic_2025_plus']['sharpe'],name))
          print('\n=== TOP BY 2016-2022 SELECTION SHARPE ===')
          for sel,full,recent,name in sorted(rows,reverse=True):
              print(f'{name:48s} selection={sel!s:>11} full={full!s:>11} 2025+={recent!s:>11}')
          PY
      - name: Preserve wave 1 machine-readable evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPERIMENT }}-measured-${{ github.run_id }}
          path: results/${{ env.EXPERIMENT }}/
          if-no-files-found: warn
