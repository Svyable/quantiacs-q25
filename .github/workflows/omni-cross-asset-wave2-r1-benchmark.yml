name: omni-cross-asset-wave2-r1-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'strategies/generated/omni_cross_asset_wave2_r1.py'
      - 'tests/test_omni_cross_asset_wave2_r1.py'
      - 'experiments/omni_cross_asset_wave2_20260915r1/**'
      - '.github/workflows/omni-cross-asset-wave2-r1-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-wave2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_KEY: default
      EXPERIMENT: omni_cross_asset_wave2_20260915r1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Quantiacs toolbox and tests
        run: python -m pip install -r requirements.txt pytest
      - name: Verify wave 2 freeze
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          f=json.loads(Path('experiments/omni_cross_asset_wave2_20260915r1/implementation_freeze.json').read_text())
          assert f['implemented_before_wave1_family_returns_observed'] is True
          assert f['wave2_market_returns_observed_before_freeze'] is False
          actual=subprocess.check_output(['git','hash-object','strategies/generated/omni_cross_asset_wave2_r1.py'],text=True).strip()
          assert actual==f['repair_wrapper_git_blob_sha'],(actual,f['repair_wrapper_git_blob_sha'])
          print('wave 2 pre-return freeze verified')
          PY
      - name: Run wave 2 causal tests
        run: python -m pytest -q tests/test_omni_cross_asset_wave2_r1.py
      - name: Measure preregistered wave 2
        run: |
          mkdir -p "results/$EXPERIMENT"
          python strategies/generated/omni_cross_asset_wave2_r1.py --output "results/$EXPERIMENT/summary.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/omni_cross_asset_wave2_20260915r1/summary.json')
          x=json.loads(p.read_text())
          print('\n=== WAVE 2 DECISIONS ===')
          print(json.dumps(x['family_decisions'],indent=2,sort_keys=True))
          rows=[]
          for name,m in x['metrics'].items():
              rows.append((m['selection_2016_2022']['sharpe'],m['full_is']['sharpe'],name))
          print('\n=== TOP BY 2016-2022 SELECTION SHARPE ===')
          for sel,full,name in sorted(rows,reverse=True):
              print(f'{name:52s} selection={sel!s:>12} full={full!s:>12}')
          PY
      - name: Preserve wave 2 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPERIMENT }}-measured-${{ github.run_id }}
          path: results/${{ env.EXPERIMENT }}/
          if-no-files-found: warn
