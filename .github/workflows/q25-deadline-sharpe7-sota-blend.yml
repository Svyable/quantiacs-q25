name: q25-deadline-sharpe7-sota-blend

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/deadline_20260918_sharpe7_sota_blend/**'
      - 'research/measure_sharpe7_sota_blend.py'
      - '.github/workflows/q25-deadline-sharpe7-sota-blend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-multipass:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Verify frozen member source blobs
        run: |
          test "$(git rev-parse HEAD:strategies/generated/ebenezar_20260912_sharpe7_vol2.py)" = "cd2876aa22f81bad5ecc71637689e5cbe513c8f3"
          test "$(git rev-parse HEAD:strategies/q25_sota_meta_ensemble.py)" = "757c9515747bd884a1f5c1d4b1c5259af803e75c"
      - name: Measure fixed equal-weight synthesis
        shell: bash
        run: |
          set -o pipefail
          python -m research.measure_sharpe7_sota_blend | tee sharpe7_sota_blend.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q25-sharpe7-sota-blend-${{ github.run_id }}
          path: sharpe7_sota_blend.txt
          if-no-files-found: error
