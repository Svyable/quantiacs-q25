name: q25-measure-ebenezar-frozen

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/measure_ebenezar_frozen.py'
      - '.github/workflows/q25-measure-ebenezar-frozen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-multipass:
    strategy:
      fail-fast: false
      matrix:
        profile:
          - sharpe3_vol_guard
          - sharpe7_vol2
          - dual_sharpe_classifier
          - sharpe_acceleration
          - residual_sharpe
          - sharpe_pullback_reentry
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Measure frozen profile
        shell: bash
        run: |
          set -o pipefail
          python -m research.measure_ebenezar_frozen | tee "ebenezar_${PROFILE}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: q25-ebenezar-${{ matrix.profile }}-${{ github.run_id }}
          path: ebenezar_*.txt
          if-no-files-found: error
