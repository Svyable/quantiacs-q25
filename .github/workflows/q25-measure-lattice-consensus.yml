name: q25-measure-lattice-consensus

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/deadline_20260918_lattice_consensus/**'
      - 'research/measure_lattice_consensus.py'
      - '.github/workflows/q25-measure-lattice-consensus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-single-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_KEY: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify exact source blob and existing causality test
        run: |
          test "$(git rev-parse HEAD:strategies/generated/ebenezar_20260912_lattice_consensus.py)" = "954279e111f289170bf8e5fbddc1a0501415864b"
          python -m pytest -q tests/test_ebenezar_profiles.py
      - name: Measure frozen lattice consensus
        shell: bash
        run: |
          set -o pipefail
          python -m research.measure_lattice_consensus | tee lattice_consensus_measurement.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q25-lattice-consensus-${{ github.run_id }}
          path: lattice_consensus_measurement.txt
          if-no-files-found: error
