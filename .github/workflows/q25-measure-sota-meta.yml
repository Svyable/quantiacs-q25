name: q25-measure-sota-meta

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/deadline_20260918_sota_meta/**'
      - 'research/measure_sota_meta.py'
      - '.github/workflows/q25-measure-sota-meta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-multipass:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Verify exact source blob is frozen
        run: |
          test "$(git rev-parse HEAD:strategies/q25_sota_meta_ensemble.py)" = "757c9515747bd884a1f5c1d4b1c5259af803e75c"
      - name: Measure frozen source multipass
        shell: bash
        run: |
          set -o pipefail
          python -m research.measure_sota_meta | tee sota_meta_measurement.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q25-sota-meta-${{ github.run_id }}
          path: sota_meta_measurement.txt
          if-no-files-found: error
