name: q25-pack2-development-screen

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/measure_orthogonal_alpha_pack2.py'
      - 'strategies/generated/q25_volatility_contraction_breakout.py'
      - 'strategies/generated/q25_drawdown_recovery.py'
      - 'strategies/generated/q25_cross_sectional_dispersion.py'
      - 'strategies/generated/q25_trend_consistency.py'
      - 'experiments/orthogonal_alpha_pack_2_20260922/preregistration.json'
      - '.github/workflows/q25-pack2-development-screen.yml'
  workflow_dispatch:

concurrency:
  group: q25-pack2-development-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  development-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_KEY: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Measure frozen Pack2 through 2022 only
        shell: bash
        run: |
          set -o pipefail
          python -m research.measure_orthogonal_alpha_pack2 | tee pack2_development.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q25-pack2-development-${{ github.run_id }}
          path: pack2_development.txt
          if-no-files-found: error
