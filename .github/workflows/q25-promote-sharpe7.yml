name: q25-promote-sharpe7

on:
  pull_request:
    branches: [main]
    paths:
      - 'submissions/q25_sharpe7_vol2_multipass.py'
      - 'evidence/deadline_20260918_sharpe7/**'
      - 'tests/test_q25_sharpe7_submission.py'
      - '.github/workflows/q25-promote-sharpe7.yml'

permissions:
  contents: read

jobs:
  frozen-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_q25_sharpe7_submission.py
      - run: python -m py_compile submissions/q25_sharpe7_vol2_multipass.py
