name: q25-submission-stability

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/compare_submission_stability.py'
      - 'submissions/**'
      - '.github/workflows/q25-submission-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    strategy:
      fail-fast: false
      matrix:
        candidate: [lattice, sota, hit126]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Measure production-mode stability
        shell: bash
        run: |
          set -o pipefail
          python -m research.compare_submission_stability | tee "stability_${CANDIDATE}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: q25-stability-${{ matrix.candidate }}-${{ github.run_id }}
          path: stability_*.txt
          if-no-files-found: error
