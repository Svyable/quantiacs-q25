name: q25-validate-sharpe7-forward

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/deadline_20260918_sharpe7_validation/**'
      - 'research/validate_sharpe7_forward.py'
      - '.github/workflows/q25-validate-sharpe7-forward.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-forward-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_KEY: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Verify promoted source is still exact
        run: |
          test "$(git rev-parse HEAD:submissions/q25_sharpe7_vol2_multipass.py)" = "cd2876aa22f81bad5ecc71637689e5cbe513c8f3"
      - name: Open frozen forward validation once
        shell: bash
        run: |
          set -o pipefail
          python -m research.validate_sharpe7_forward | tee sharpe7_forward_validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q25-sharpe7-forward-validation-${{ github.run_id }}
          path: sharpe7_forward_validation.txt
          if-no-files-found: error
