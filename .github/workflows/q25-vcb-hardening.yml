name: q25-vcb-hardening
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/measure_vcb_hardening.py'
      - 'strategies/generated/q25_volatility_contraction_breakout.py'
      - '.github/workflows/q25-vcb-hardening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardening-development-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_KEY: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Measure frozen VCB through 2022 only
        shell: bash
        run: |
          set -o pipefail
          python -m research.measure_vcb_hardening | tee vcb_hardening.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q25-vcb-hardening-${{ github.run_id }}
          path: vcb_hardening.txt
          if-no-files-found: error
