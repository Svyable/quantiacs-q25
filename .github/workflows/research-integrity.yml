name: research-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install static-audit dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas xarray pyyaml

      - name: Compile Python research surface
        run: python -m compileall -q factory research scripts strategies

      - name: Run repository static-audit self test
        run: python research/static_audit.py

      - name: Validate frozen historical roster
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("configs/historical_top10.yaml")
          data = yaml.safe_load(path.read_text())
          rows = data["strategies"]
          assert len(rows) == 10
          assert [row["rank"] for row in rows] == list(range(1, 11))
          assert all(row["full_sharpe"] > 0 for row in rows)
          assert data["current_official_clearance"] is False
          print("historical_top10.yaml integrity OK")
          PY

      - name: Validate research frontier and agent contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from factory.mechanisms import mechanism_ids

          frontier = yaml.safe_load(Path("configs/research_frontier.yaml").read_text())
          axes = frontier["novelty_axes"]
          assert axes == [
              "information_primitive",
              "transform",
              "timing_or_state_condition",
              "portfolio_construction",
          ]
          assert len(frontier["priority_frontiers"]) >= 8
          assert frontier["candidate_contract"]["max_initial_free_parameters"] <= 3
          assert frontier["campaign_default"]["ideation_count"] > frontier["campaign_default"]["preregister_count"]
          assert frontier["campaign_default"]["preregister_count"] >= frontier["campaign_default"]["implement_count"]

          mechanisms = set(mechanism_ids())
          required = {
              "price_delay",
              "correlation_topology",
              "liquidity_hysteresis",
              "vol_term_structure",
              "tail_dependence",
              "range_volume_geometry",
              "nonlinear_response",
              "opportunity_density",
              "execution_aware_alpha",
          }
          missing = required - mechanisms
          assert not missing, f"frontier mechanisms missing from catalog: {sorted(missing)}"

          prompt = Path("docs/AGENT_PROMPT.md").read_text()
          playbook = Path("docs/STRATEGY_GENERATION_PLAYBOOK.md").read_text()
          assert "configs/research_frontier.yaml" in prompt
          assert "24 hypothesis" in prompt.lower()
          assert "nearest incumbent" in prompt.lower()
          assert "novelty axes" in playbook.lower()
          print("research frontier / next-agent contract integrity OK")
          PY

      - name: Audit PENDING meta-ensemble source for obvious lookahead primitives
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("strategies/q25_sota_meta_ensemble.py")
          text = path.read_text()
          ast.parse(text)

          forbidden = {
              "center=True": "centered rolling window",
              "shift(-": "negative pandas shift",
              "shift(time=-": "negative xarray shift",
              "isel(time=1": "hard-coded future row access",
          }
          failures = [label for token, label in forbidden.items() if token in text]
          assert not failures, f"obvious causality hazards: {failures}"
          assert "PENDING RESEARCH STRATEGY" in text
          assert "is_liquid" in text
          print("SOTA meta-ensemble source audit OK")
          PY
