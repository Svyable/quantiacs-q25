name: research-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/quantiacs/toolbox.git@9e5274c5ce102a66debc799fd2a2300969fb90f6" \
            numpy==2.2.6 pandas==2.2.3 xarray==2025.12.0 numba==0.61.2 llvmlite==0.44.0 pyyaml pytest

      - name: Compile Python research surface
        run: python -m compileall -q factory research scripts strategies

      - name: Validate canonical JSON integrity
        run: python scripts/check_json_integrity.py evidence experiments docs/data

      - name: Run repository static-audit self test
        run: python research/static_audit.py

      - name: Validate frozen historical roster
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("configs/historical_top10.yaml")
          data = yaml.safe_load(path.read_text())
          rows = data["strategies"]
          assert len(rows) == 10
          assert [row["rank"] for row in rows] == list(range(1, 11))
          assert all(row["full_sharpe"] > 0 for row in rows)
          assert data["current_official_clearance"] is False
          print("historical_top10.yaml integrity OK")
          PY

      - name: Validate Research Mandate V2 and frontier contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          mandate = yaml.safe_load(Path("configs/research_mandate_v2.yaml").read_text())
          frontier = yaml.safe_load(Path("configs/research_frontier.yaml").read_text())
          chronology = yaml.safe_load(Path("configs/chronological_folds.yaml").read_text())
          promotion = yaml.safe_load(Path("configs/promotion_gates.yaml").read_text())

          assert mandate["version"] == 2
          assert mandate["data_use"]["completed_history_available_for_research"] is True
          assert mandate["data_use"]["permanent_historical_holdout_required"] is False
          assert mandate["evaluation"]["primary_design"] == "rolling_origin_prequential"
          assert mandate["recency"]["enabled"] is True
          assert mandate["exploration"]["broad_search_allowed"] is True
          assert mandate["exploration"]["parameter_search_allowed"] is True
          assert mandate["exploration"]["search_ledger_required"] is True
          assert mandate["portfolio_selection"]["standalone_sharpe_is_not_primary"] is True
          assert mandate["promotion"]["pareto_frontier_required"] is True

          contract = frontier["candidate_contract"]
          assert contract["max_initial_free_parameters"] is None
          assert contract["complexity_penalty_required"] is True
          assert contract["allow_completed_history_adaptive_reuse"] is True
          assert contract["search_ledger_required"] is True
          assert contract["forbid_live_forward_tuning"] is True
          assert contract["external_data_requires_current_q25_verification"] is True

          assert chronology["protocol"]["primary"] == "rolling_origin_prequential"
          assert chronology["protocol"]["permanent_historical_holdout"] is False
          assert promotion["research_v2"]["selection"] == "pareto_frontier"
          assert promotion["research_v2"]["single_scalar_megascore"] is False

          prompt = Path("docs/AGENT_PROMPT.md").read_text()
          agents = Path("AGENTS.md").read_text()
          doc = Path("docs/RESEARCH_MANDATE_V2.md").read_text()
          assert "all completed Sponsor history" in agents
          assert "rolling-origin" in agents
          assert "API_KEY=default" in agents
          assert "configs/research_frontier.yaml" in prompt
          assert "nearest incumbent" in prompt.lower()
          assert "API_KEY=default" in prompt
          assert "Historical one-shot holdout experiments" in doc
          print("Research Mandate V2 / frontier contract integrity OK")
          PY

      - name: Validate public-default local research access contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          env_example = Path(".env.example").read_text()
          agents = Path("AGENTS.md").read_text()
          prompt = Path("docs/AGENT_PROMPT.md").read_text()
          method = Path("docs/RESEARCH_METHOD.md").read_text()
          pyramid = Path("docs/TESTING_PYRAMID.md").read_text()
          access = Path("docs/LOCAL_RESEARCH_ACCESS.md").read_text()
          submission = Path("docs/SUBMISSION_CHECKLIST.md").read_text()
          readme = Path("README.md").read_text()

          assert "API_KEY=default" in env_example
          assert "LOCAL_RESEARCH_ACCESS.md" in agents
          assert "LOCAL_RESEARCH_ACCESS.md" in prompt
          assert "API_KEY=default" in agents
          assert "API_KEY=default" in prompt
          assert "API_KEY=default" in method
          assert "API_KEY=default" in pyramid
          assert "API_KEY=default" in access
          assert "API_KEY=default" in submission
          assert "No personal Quantiacs API key is required" in readme
          assert "participant-specific" in submission

          os.environ.pop("API_KEY", None)
          import factory.runner as runner
          runner.load_dotenv = lambda path=None: None
          assert runner.ensure_local_data_access() == "default"
          assert runner.quantiacs_access_mode() == "public_default"
          assert not runner.has_authenticated_api_key()
          print("public-default local research access contract OK")
          PY

      - name: Validate external public-research intelligence
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path("configs/external_research_leads.yaml").read_text())
          sources = data["sources"]
          leads = {row["id"]: row for row in data["priority_leads"]}

          assert "official_q24_guide" in sources
          assert "q25_leaderboard" in sources
          assert "q24_leaderboard" in sources
          assert "public_q25_lowvol_repo" in sources
          assert "public_predictive_coding_repo" in sources

          required = {
              "onchain_state_cross_section",
              "online_forecast_surprise",
              "forecast_disagreement_opportunity",
              "price_volume_elasticity",
              "benchmark_composition_ecology",
              "persistent_low_vol_control",
          }
          assert required <= set(leads)
          assert leads["onchain_state_cross_section"]["q25_admissibility"] == "UNVERIFIED_FOR_Q25"
          assert leads["benchmark_composition_ecology"]["q25_admissibility"] == "UNVERIFIED_FOR_Q25"
          assert data["next_campaign"]["ideation_total"] == 24
          assert sum(data["next_campaign"]["allocation"].values()) == 24

          text = Path("docs/EXTERNAL_RESEARCH_LEADS.md").read_text()
          assert "Q25 admissibility" in text
          assert "Do not infer" in text
          assert "Q24 winner" in text
          print("external research intelligence integrity OK")
          PY

      - name: Audit PENDING meta-ensemble source for obvious lookahead primitives
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("strategies/q25_sota_meta_ensemble.py")
          text = path.read_text()
          ast.parse(text)

          forbidden = {
              "center=True": "centered rolling window",
              "shift(-": "negative pandas shift",
              "shift(time=-": "negative xarray shift",
              "isel(time=1": "hard-coded future row access",
          }
          failures = [label for token, label in forbidden.items() if token in text]
          assert not failures, f"obvious causality hazards: {failures}"
          assert "PENDING RESEARCH STRATEGY" in text
          assert "is_liquid" in text
          print("SOTA meta-ensemble source audit OK")
          PY

      - name: Test frontier strategies and iteration evidence boundaries
        run: python -m pytest -q tests
