name: topology-rank-stability-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'strategies/generated/frontier_20260910b_topology_rank_stability.py'
      - 'experiments/frontier_20260910b/topology_rank_stability/manifest.json'
      - 'experiments/frontier_20260910b/topology_rank_stability/preregistration.json'
      - 'experiments/frontier_20260910b/topology_rank_stability/preregistration.sha256'
      - 'research/benchmark.py'
      - 'research/iteration.py'
      - '.github/workflows/topology-rank-stability-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measured-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: default
      CAMPAIGN: frontier_20260910b_topology_rank_stability
      MANIFEST: experiments/frontier_20260910b/topology_rank_stability/manifest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quantiacs toolbox and tests
        run: python -m pip install -r requirements.txt pytest

      - name: Run software and causality gates
        run: python -m pytest -q tests

      - name: Verify generated dashboard is canonical
        run: python scripts/build_research_dashboard.py --check

      - name: Run isolated preregistered development follow-up
        id: measure
        run: |
          python -m research.iteration \
            --manifest "$MANIFEST" \
            --output "results/$CAMPAIGN" \
            --budget 8

      - name: Print measured follow-up report
        if: ${{ always() && steps.measure.outcome == 'success' }}
        run: |
          RESULT_DIR="$(find "results/$CAMPAIGN" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          echo "RESULT_DIR=$RESULT_DIR"
          test -n "$RESULT_DIR"
          cat "$RESULT_DIR/report.md" || true
          python - "$RESULT_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          ranks = json.loads((root / "rankings.json").read_text())
          print("\n=== TOPOLOGY RANK STABILITY EVIDENCE ===")
          print(json.dumps(ranks, indent=2, sort_keys=True))
          PY

      - name: Preserve measured follow-up evidence
        if: ${{ always() && steps.measure.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAMPAIGN }}-measured-${{ github.run_id }}
          path: results/${{ env.CAMPAIGN }}/
          if-no-files-found: error
