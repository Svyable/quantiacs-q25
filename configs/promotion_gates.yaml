# Q25 promotion/admission policy.
# Contest hard gates remain binary. Research ranking is Pareto/multi-objective.
version: 2
updated: "2026-09-23"

contest_hard:
  sharpe_is_min:
    value: 1.0
    operator: "strictly_greater_than"
    start: "2016-01-01"
    class: CONTEST_HARD
  long_only: {value: true, class: CONTEST_HARD}
  liquid_only: {value: true, class: CONTEST_HARD}
  no_manual_coin_picking: {value: true, class: CONTEST_HARD}
  sponsor_data_only: {value: true, class: CONTEST_HARD}
  reject_buy_and_hold: {value: true, class: CONTEST_HARD}
  reject_toolbox_loopholes: {value: true, class: CONTEST_HARD}
  uniqueness_correlation:
    value: true
    class: CONTEST_HARD
    note: "Must pass current Quantiacs uniqueness/correlation requirement before submission."
  positive_contest_period_performance:
    value: true
    class: CONTEST_HARD

research_v2:
  selection: "pareto_frontier"
  single_scalar_megascore: false
  permanent_historical_holdout_required: false
  rolling_origin_required_for_serious_survivor: true
  recent_evidence_required: true
  recency_weighted_and_unweighted_reported: true
  search_ledger_required: true
  parameter_neighborhood_required: true
  destructive_control_required: true
  simple_baseline_required: true
  portfolio_marginal_contribution_required: true
  cost_atr_fractions: [0.04, 0.08, 0.12]
  required_dimensions:
    - full_history_sharpe
    - recent_prequential_sharpe
    - marginal_portfolio_sharpe
    - return_correlation
    - max_drawdown
    - drawdown_overlap
    - turnover
    - turnover_overlap
    - cost_robustness
    - vol10_normalized_return
    - parameter_stability
    - complexity
  note: "No universal soft threshold on every dimension. Use Pareto dominance, mechanism evidence and contest hard gates."

production:
  exact_current_is_required: true
  deterministic_required: true
  prefix_or_bounded_replay_required: true
  asset_order_invariance_where_relevant: true
  authenticated_uniqueness_required_before_submission: true
  freeze_before_genuine_live_forward: true
  simple_stable_blend_preferred: true

historical_compatibility:
  preserve_old_preregistrations: true
  preserve_old_holdout_decisions: true
  old_holdouts_may_be_reused_by_new_research: true
  reuse_label: "ADAPTIVE_REUSE"
