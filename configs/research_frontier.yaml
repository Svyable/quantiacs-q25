# Q25 research frontier / novelty map
# Purpose: stop future agents from spending research budget rediscovering the
# same return streams under new names.
#
# This is a guidance map, not a performance registry. Historical metrics live in
# configs/historical_top10.yaml. Promotion thresholds live in
# configs/promotion_gates.yaml. External public-intelligence provenance lives in
# configs/external_research_leads.yaml and docs/EXTERNAL_RESEARCH_LEADS.md.
# Do not infer edge from priority alone.

as_of: "2026-09-09"
external_research_ref: "configs/external_research_leads.yaml"

novelty_axes:
  - information_primitive
  - transform
  - timing_or_state_condition
  - portfolio_construction

novelty_rule: >-
  Before backtesting, compare every proposal with the nearest incumbent. A new
  alpha candidate should differ on at least two novelty axes. If it differs on
  only one axis, treat it as an ablation, control, or family refinement rather
  than a new independent strategy. A new filename, lookback, threshold, blend
  weight, rebalance day, or risk scaler is not sufficient evidence of novelty.

occupied_or_crowded:
  - family: "downside_impact_relief"
    incumbents: [frontier_20260911e_downside_impact_relief]
    note: "FROZEN / FALSIFIED_DEVELOPMENT: removing volume beats the central relief cell; no base window reaches the 1.0 robust floor. A price-impact proxy is not observed order flow."
  - family: "range_acceptance_escape"
    incumbents: [frontier_20260911e_range_acceptance_escape]
    note: "FROZEN / FALSIFIED_DEVELOPMENT: central acceptance-conditioned breakout loses to both its acceptance-free and stale-state controls. Do not widen the grid."
  - family: "upside_response_convexity"
    incumbents: [frontier_20260911e_upside_response_convexity]
    note: "FROZEN / FALSIFIED_DEVELOPMENT: best base robust SR 0.827; inverted central control 0.985. Positive central residual diagnostic does not rescue the failed direction or qualify either cell."
  - family: "variance_ratio_conditioned_reversal"
    incumbents: [frontier_20260910d_variance_ratio_reversal]
    note: "FROZEN / FALSIFIED_DEVELOPMENT: three base windows miss the floor; removing or inverting the serial-dependence condition beats the central base. No parameter-grid rescue. See evidence/frontier_20260910d."
  - family: "ordinal_rank_transition_reliability"
    incumbents: [frontier_20260910d_rank_transition]
    note: "FROZEN / FALSIFIED_DEVELOPMENT: reliability weighting is largely erased by fixed-slot allocation; central base, ablation and falsifier have identical dev returns. Check target-level identifiability before claiming a new interaction."
  - family: "multi_factor_trend_quality_risk"
    incumbents: [V10, aqr_factor_balance, V5_latency, Trend_hit126]
    note: "Crowded. New work must show residual value beyond the V10/factor/trend lineage."
  - family: "event_lifecycle_calendar_motif"
    incumbents: [V11_balanced]
    note: "V11 already owns simple lifecycle, calendar recurrence, shock-network and short motif combinations."
  - family: "market_consensus_risk_timing"
    incumbents: [C165]
    note: "Treat fast/medium market-trend blend variations as C165-family refinements."
  - family: "abnormal_volume_directed_return_diffusion"
    incumbents: [V12]
    note: "Simple abnormal-volume -> next residual-return network variants are V12-family work unless the network object or state variable is materially new."
  - family: "crash_comovement_defense"
    incumbents: [CoCrash126]
    note: "Simple low co-crash / low-beta / downside-safety sorts are likely crowded."
  - family: "residual_dispersion_timing"
    incumbents: [hrt_dispersion_switch]
    note: "Simple residual-dispersion gates are occupied."
  - family: "breadth_risk_gate"
    incumbents: [Breadth]
    note: "Simple percent-above-MA / breadth-thrust risk-on gates are occupied."
  - family: "low_residual_skew"
    incumbents: [V13, q25_sota_meta_ensemble_v1]
    note: "Higher moments remain interesting, but raw low residual skew is already explored and V13 had unacceptable historical drawdown."
  - family: "residual_momentum"
    incumbents: [V10, q25_sota_meta_ensemble_v1]
    note: "Residual momentum alone is not frontier research."
  - family: "path_efficient_trend"
    incumbents: [aqr_factor_balance, q25_sota_meta_ensemble_v1]
    note: "Plain efficiency-ratio trend is a control, not a new frontier."
  - family: "generic_classifier_ta"
    incumbents: []
    note: >-
      Public Q25 titles show rolling classifiers/XGBoost/Markov work is already
      common. A classifier is not novel unless the label/information primitive
      is economically distinct and survives a non-ML ablation.
  - family: "generic_low_vol_selection"
    incumbents: [aqr_factor_balance, C165]
    note: >-
      Public Q25 research and leaderboard titles make simple low-volatility
      ranking a useful control but a crowded discovery claim.

priority_frontiers:
  - id: "onchain_state_cross_section"
    priority: 1
    q25_admissibility: "UNVERIFIED_FOR_Q25"
    thesis_space: >-
      Use a Quantiacs-provided blockchain/network metric as a global causal state
      variable and interact it with automatic cross-sectional OHLCV/liquidity
      features. Candidate objects include network-state acceleration, state age,
      price/on-chain disagreement and network-state-conditioned liquidity age or
      elasticity. Official Q24 documentation demonstrated blockchaincom loaders,
      but Q25 permission and timestamp semantics must be verified before any
      submission implementation.
    avoid: >-
      Do not hard-code BTC or another symbol, do not mine a large zoo of chain
      metrics, and do not assume Q24 dataset permission automatically carries to Q25.

  - id: "online_forecast_surprise"
    priority: 1
    q25_admissibility: "OHLCV_ONLY_IF_IMPLEMENTED_WITH_CONTEST_DATA"
    thesis_space: >-
      Treat the error of a tiny causal rolling forecast as an information object:
      signed surprise, standardized surprise, calibration drift, surprise rank
      and surprise half-life. Ask whether unexpected residual realizations have
      continuation/reversal information beyond raw residual momentum.
    avoid: >-
      Do not turn this into a feature-zoo AutoML search. The model should be
      intentionally simple and every training target must already be realized.

  - id: "forecast_disagreement_state"
    priority: 1
    q25_admissibility: "OHLCV_ONLY_IF_IMPLEMENTED_WITH_CONTEST_DATA"
    thesis_space: >-
      Use disagreement among two or three deliberately different tiny causal
      models as a deployment/opportunity state. Predeclare whether disagreement
      means uncertainty/cash or structural opportunity. Compare directly with
      ordinary return/residual dispersion so this does not collapse into the
      existing dispersion family.
    avoid: "No large ensembles, full-history model weighting, or post-hoc choice of disagreement direction."

  - id: "price_volume_elasticity"
    priority: 1
    q25_admissibility: "OHLCV_ONLY"
    thesis_space: >-
      Model self-asset price/range displacement relative to abnormal dollar
      volume and close-location/path geometry. Distinguish absorption/exhaustion
      (large flow, little net displacement) from efficient/fragile repricing
      (large displacement per unit flow). Keep this structurally separate from
      V12 directed abnormal-volume -> next residual-return diffusion.
    avoid: >-
      Do not infer a formula from public leaderboard titles. Avoid unstable raw
      division near zero; prefer bounded/rank/log transforms and explicit
      interaction falsifiers.

  - id: "assimilation_delay_dynamics"
    priority: 1
    thesis_space: >-
      Model how quickly each asset absorbs common-market or cross-asset shocks,
      including changes in lag structure, acceleration/deceleration, cohort
      response and leader/follower turnover. Prior delay work found signal but
      hit correlation gates, so seek a more structurally independent observable,
      not a retuned copy of the rejected candidates.
    avoid: "Do not tune directly against already observed rejected delay candidates."

  - id: "correlation_topology_change"
    priority: 1
    thesis_space: >-
      Use causal changes in the residual correlation/covariance graph: centrality
      migration, eigenvalue concentration, cluster fragmentation, bridge nodes,
      correlation breakdown or recovery. Focus on topology dynamics rather than
      static low-correlation ranking.
    avoid: "Do not reduce this to residual dispersion, generic HRP or low beta."

  - id: "liquidity_transition_hysteresis"
    priority: 1
    thesis_space: >-
      Study pre/post is_liquid transitions, age-since-entry, persistence after
      entry, re-entry, and hysteresis around eligibility changes. Treat universe
      membership itself as a state process while remaining fully asset-agnostic.
    avoid: "Do not reproduce V11's simple positive-entry lifecycle sleeve."

  - id: "volatility_term_structure"
    priority: 1
    thesis_space: >-
      Compare short/medium/long realized volatility, volatility-of-volatility,
      acceleration, compression and cross-sectional relative vol states. Ask
      whether the *shape* of the vol curve predicts cross-sectional returns or
      safe deployment, not merely whether high vol should reduce gross.
    avoid: "Plain inverse-vol weighting and generic high-vol risk-off are controls."

  - id: "benchmark_composition_ecology"
    priority: 2
    q25_admissibility: "UNVERIFIED_FOR_Q25"
    thesis_space: >-
      If historical CRYPTO10 benchmark weights are available and permitted, treat
      index composition as a dynamic market-cap ecology: concentration, member
      rank migration, weight acceleration, entry maturation and leadership
      turnover. This can add information beyond binary is_liquid membership.
    avoid: >-
      Do not hold the benchmark directly, use future-finalized monthly weights,
      or assume qndata.index_load_weights is Q25-admissible without verification.

  - id: "tail_dependence_state"
    priority: 2
    thesis_space: >-
      Go beyond skew and co-crash with semivariance, downside co-exceedance,
      conditional tail dependence, recovery asymmetry, drawdown duration and
      robust quantile-state features using only causal OHLCV histories.
    avoid: "Do not repackage CoCrash126 or V13 with a different lookback."

  - id: "range_volume_geometry"
    priority: 2
    thesis_space: >-
      Explore the joint geometry of high-low range, close location, volume shock,
      path efficiency and subsequent response. Prefer interaction structure and
      state transitions over single-indicator candles.
    avoid: "Simple volume confirmation or efficiency-ratio trend is crowded."

  - id: "shock_recovery_surface"
    priority: 2
    thesis_space: >-
      Model recovery after asset-specific or market shocks: time-since-shock,
      depth, breadth, recovery slope, failed recovery and relative recovery
      sequencing. Separate continuation after recovery from blind dip-buying.
    avoid: "Do not select one visually compelling crash window."

  - id: "cross_sectional_response_convexity"
    priority: 2
    thesis_space: >-
      Estimate nonlinear or state-dependent response of one asset/cohort to
      another asset or market shock: saturation, sign asymmetry, threshold
      effects, lag compression and conditional leader reliability.
    avoid: "A linear V12-style volume diffusion network with new thresholds is not enough."

  - id: "opportunity_density"
    priority: 3
    thesis_space: >-
      Predict when the cross-section contains enough independent opportunity to
      justify concentration: score dispersion, rank stability, leader turnover,
      breadth of residual alpha and disagreement across mechanism families.
    avoid: "Do not use the target strategy's realized future return to define opportunity."

  - id: "execution_aware_alpha_density"
    priority: 3
    thesis_space: >-
      Rank or gate expected signal strength relative to ATR-linked turnover cost,
      state-dependent trade distance and persistence. The research question is
      whether an alpha survives *because it waits*, not simply because weights
      are smoothed after the fact.
    avoid: "Post-hoc turnover smoothing without an alpha-per-cost hypothesis is not a new mechanism."

  - id: "persistent_low_vol_external_control"
    priority: 3
    classification: "CONTROL_NOT_FRONTIER_ALPHA"
    thesis_space: >-
      Independently reproduce a simple cross-sectional persistent low-volatility
      selector as an external benchmark/control. A public Q25 repo reports strong
      local 2024-2025 behavior, but those numbers are not trusted evidence here.
    avoid: "Do not import public metrics or exact tuned parameters and do not call a basic low-vol rank a new mechanism."

candidate_contract:
  max_initial_free_parameters: 3
  require_named_falsifier: true
  require_nearest_incumbent: true
  require_novelty_axes_changed: true
  require_ablation: true
  require_cash_allowed: true
  require_historical_is_liquid: true
  forbid_manual_symbols: true
  forbid_external_strategy_data: true
  forbid_holdout_tuning: true
  external_data_requires_current_q25_verification: true
  external_inspiration_requires_source_provenance: true

campaign_default:
  ideation_count: 24
  preregister_count: 6
  implement_count: 3
  internet_sweep_suggested_allocation:
    onchain_state_cross_section: 7
    online_surprise_and_disagreement: 7
    price_volume_elasticity: 5
    benchmark_composition_ecology: 5
  note: >-
    These counts are a default research cadence, not a statistical guarantee.
    Generate broadly before testing, then spend compute only on the most novel,
    falsifiable proposals. If on-chain/index data are not currently Q25-admissible,
    reallocate those idea slots to OHLCV-only surprise, topology, vol-term and
    range-volume work. Do not alter a rejected mechanism repeatedly until it
    passes; open a new experiment only for a materially new hypothesis.

stop_rules:
  - "Kill obvious incumbent clones before a backtest."
  - "Kill a mechanism when its stated falsifier passes or the mechanism interpretation collapses."
  - "Do not relax a gate because a candidate narrowly misses it."
  - "Do not treat an already observed diagnostic period as a fresh validation set."
  - "Do not promote a family merely because one parameter point has the highest Sharpe."
  - "Do not convert a failed correlation gate into a blend-weight optimization problem."
  - "Do not use a Q24-supported dataset in Q25 until current Q25 admissibility and timing are verified."
  - "Do not infer implementation details from a public leaderboard strategy title."
